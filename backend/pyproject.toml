[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "price-lens"
version = "0.1.0"
description = "Traceable Taiwan agricultural wholesale market data foundation"
readme = {text = "Price Lens Phase 1 backend and official wholesale-market ETL.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=26,<27",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
price-lens = "price_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/price_lens"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL TEST_DATABASE_URL",
  "live: calls the official Ministry of Agriculture API",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
